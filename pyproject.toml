[tool.ruff]
line-length = 100
target-version = "py313"
# Markdown исключён намеренно: ruff форматирует python-блоки внутри .md, а в
# ARCHITECTURE.md примеры свёрстаны под чтение, а не под line-length кодовой базы
extend-exclude = ["**/migrations/*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
addopts = "--ds=config.settings.test -q"
python_files = ["test_*.py"]
