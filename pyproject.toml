[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
addopts = "--ds=config.settings.test -q"
python_files = ["test_*.py"]
