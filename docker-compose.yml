services:
  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myspotify
      POSTGRES_USER: myspotify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myspotify}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myspotify -d myspotify"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
